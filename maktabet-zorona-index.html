<title>مكتبة زورونا</title>
<style>
  :root{
    --teal:#0E93A8;
    --teal-light:#3FC1D6;
    --teal-deep:#075E6B;
    --paper:#FFFFFF;
    --ink:#070707;
    --ink-2:#121212;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    height:100%;width:100%;
    overflow:hidden;
    position:fixed;
    inset:0;
    background:var(--ink);
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    touch-action:manipulation;
  }

  /* ---------- Loading splash ---------- */
  .splash{
    position:fixed;
    inset:0;
    z-index:9999;
    background:
      radial-gradient(480px 420px at 50% 38%, rgba(63,193,214,.16), rgba(63,193,214,0) 62%),
      var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:opacity .55s ease, transform .6s ease;
  }
  .splash.hide{
    opacity:0;
    transform:scale(1.04);
    pointer-events:none;
  }

  .book-scene{
    width:132px;
    height:98px;
    perspective:650px;
  }
  .book{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    opacity:0;
    animation:bookIn .5s ease forwards;
    filter:drop-shadow(0 10px 18px rgba(0,0,0,.5));
  }
  @keyframes bookIn{
    from{opacity:0; transform:translateY(8px) scale(.94);}
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .bookmark{
    position:absolute;
    top:-13px;
    left:50%;
    width:13px;
    height:32px;
    background:var(--teal-light);
    clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);
    transform:translate(-50%,-6px);
    opacity:0;
    animation:bookmarkIn .45s ease forwards .05s;
    z-index:3;
  }
  @keyframes bookmarkIn{ to{ opacity:1; transform:translate(-50%,0); } }
  .pages{
    position:absolute;
    inset:8px 6px 4px 6px;
    background:#F1F1EF;
    border-radius:6px;
    box-shadow:0 10px 22px rgba(0,0,0,.4);
  }
  .pages::before{
    content:'';
    position:absolute;
    left:50%;top:5px;bottom:5px;
    width:2px;
    background:rgba(0,0,0,.16);
    transform:translateX(-50%);
  }
  .pages::after{
    content:'';
    position:absolute;
    left:16%;right:16%;top:32%;
    height:2px;
    background:rgba(0,0,0,.09);
    box-shadow:0 11px 0 rgba(0,0,0,.09), 0 22px 0 rgba(0,0,0,.06);
  }
  .cover-left,.cover-right{
    position:absolute;
    top:0;bottom:0;width:50%;
    background:linear-gradient(135deg, var(--teal), var(--teal-deep));
    backface-visibility:hidden;
    box-shadow:0 12px 24px rgba(0,0,0,.5);
  }
  .cover-left{
    left:0;
    border-radius:8px 0 0 8px;
    transform-origin:right center;
    animation:openLeft .75s cubic-bezier(.4,0,.2,1) forwards;
    animation-delay:.55s;
  }
  .cover-right{
    right:0;
    border-radius:0 8px 8px 0;
    transform-origin:left center;
    animation:openRight .75s cubic-bezier(.4,0,.2,1) forwards;
    animation-delay:.55s;
  }
  @keyframes openLeft{ to{ transform:rotateY(-125deg); } }
  @keyframes openRight{ to{ transform:rotateY(125deg); } }

  .load-wrap{
    position:relative;
    width:170px;
    height:1.5px;
    margin-top:30px;
  }
  .track{
    position:absolute;
    inset:0;
    background:rgba(63,193,214,.26);
  }
  .fill{
    position:absolute;
    left:0;top:0;height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--teal-deep), var(--teal-light));
    animation:fillBar 1.05s ease forwards .55s;
  }
  @keyframes fillBar{ to{ width:100%; } }

  @media (prefers-reduced-motion:reduce){
    .splash{display:none;}
  }

  /* ---------- Main page ---------- */
  .stage{
    position:fixed;
    inset:0;
    height:100vh;
    height:100dvh;
    width:100vw;
    background:
      radial-gradient(560px 420px at 50% 6%, rgba(63,193,214,.13), rgba(63,193,214,0) 60%),
      radial-gradient(900px 700px at 50% 108%, rgba(63,193,214,.08), rgba(63,193,214,0) 55%),
      var(--ink);
  }

  .brand{
    position:absolute;
    left:0;right:0;
    top:calc(env(safe-area-inset-top, 0px) + 9vh);
    display:flex;
    flex-direction:column;
    align-items:center;
    opacity:0;
    translate:0 -12px;
    transition:opacity .6s ease, translate .6s cubic-bezier(.19,1,.22,1);
  }
  .brand.show{opacity:1;translate:0 0;}
  .logo-card{
    width:260px;
    max-width:70vw;
    aspect-ratio:900/451;
    border-radius:26px;
    background:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px 20px;
    box-shadow:
      0 20px 40px rgba(0,0,0,.55),
      0 0 0 3px rgba(63,193,214,.85),
      0 0 34px rgba(63,193,214,.25);
  }
  .logo-card img{width:100%;height:100%;object-fit:contain;display:block;}

  .actions{
    position:absolute;
    left:0;right:0;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 26px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:0 20px;
  }
  .btn{
    all:unset;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    max-width:340px;
    height:74px;
    padding:7px 24px 7px 7px;
    border-radius:999px;
    background:linear-gradient(155deg,#161a1b,#0a0c0c);
    box-shadow:
      0 14px 30px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.05),
      0 0 0 1px rgba(63,193,214,.22);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease, opacity .5s ease, translate .5s cubic-bezier(.19,1,.22,1), box-shadow .2s ease;
    opacity:0;
    translate:0 14px;
  }
  .actions.show .btn{opacity:1;translate:0 0;}
  .actions.show .btn:nth-of-type(1){transition-delay:.05s;}
  .actions.show .btn:nth-of-type(2){transition-delay:.16s;}
  .actions.show .btn:nth-of-type(3){transition-delay:.27s;}
  .btn:active{
    transform:scale(.965);
    box-shadow:
      0 10px 22px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,255,255,.05),
      0 0 0 1px rgba(63,193,214,.55);
  }
  .badge{
    width:60px;
    height:60px;
    border-radius:18px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    overflow:hidden;
    padding:5px;
    box-shadow:0 0 0 2px rgba(63,193,214,.55);
  }
  .badge img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .label{
    flex:1;
    text-align:center;
    color:#F1F5F6;
    font-weight:700;
    font-size:17px;
    letter-spacing:.3px;
    white-space:nowrap;
  }
</style>
</head>
<body>

  <div class="splash" id="splash">
    <div class="book-scene">
      <div class="book">
        <div class="bookmark"></div>
        <div class="pages"></div>
        <div class="cover-left"></div>
        <div class="cover-right"></div>
      </div>
    </div>
    <div class="load-wrap">
      <div class="track"></div>
      <div class="fill"></div>
    </div>
  </div>

  <div class="stage" id="stage">
